name: Bug report
description: Report a problem with the accelo-mcp server
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        **Do not include credentials or customer data.** Redact client secrets, access
        tokens, refresh tokens, cookies, webhook secrets, and any real Accelo data
        (company names, contacts, deployment identifiers) from logs and screenshots.

        For suspected security vulnerabilities, do not open a public issue. Use the
        repository's **Security → Report a vulnerability** page, or the process
        described in the repository's `SECURITY.md`.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The tool call(s) or actions that trigger the problem.
      placeholder: |
        1. Configure with ACCELO_AUTH_TYPE=...
        2. Call the tool `accelo_...` with arguments ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: accelo-mcp version
      description: Output of `pip show accelo-mcp`, or the pinned version from your MCP host config.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: mcp-host
    attributes:
      label: MCP host / client
      description: The MCP host and its version.
      placeholder: "Claude Desktop 0.x, Kiro, Cursor, VS Code, ..."
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - SSE
    validations:
      required: true

  - type: dropdown
    id: auth-type
    attributes:
      label: Auth type
      description: The ACCELO_AUTH_TYPE in use.
      options:
        - web
        - public
        - installed
        - service
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.x"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15, Ubuntu 24.04, Windows 11, ..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste any relevant log output. Logs are written to stderr.
        Redact all credentials and customer data before pasting.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have removed all credentials and real Accelo data from this report.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
        - label: I have searched existing issues and this is not a duplicate.
          required: true
