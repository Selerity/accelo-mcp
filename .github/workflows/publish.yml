name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade build tooling
        # The runner ships an older setuptools that pip-audit flags. Upgrade the
        # environment-provided build tooling to a patched version before auditing.
        run: python -m pip install --upgrade pip setuptools

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check
        run: make check

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install build

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"Tag {tag!r} does not match package version {expected!r}")
          PY

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
