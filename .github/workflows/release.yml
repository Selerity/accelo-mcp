name: Release

# Turns a version bump on main into a full release. When a push to main changes
# the project version in pyproject.toml, this workflow validates the package,
# creates the matching v<version> tag and a GitHub Release, then builds and
# publishes the distribution to PyPI via OIDC Trusted Publishing.
#
# Publish is folded into this workflow (rather than triggered by the tag push)
# on purpose: a tag pushed by the built-in GITHUB_TOKEN does not start another
# workflow, so a separate tag-triggered publish job would never run.

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so we can compare the version against the previous commit.
          fetch-depth: 0

      - name: Read package version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          print(f"version={version}")
          PY

      - name: Decide whether to release
        id: decide
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The version must have changed since the parent commit AND not already
          # be tagged on the remote. Either condition failing means no release.
          previous="$(git show 'HEAD^:pyproject.toml' 2>/dev/null \
            | python -c 'import sys,tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])' \
            2>/dev/null || echo '')"
          echo "Previous version: '${previous}', current version: '${VERSION}'"
          if [ "${previous}" = "${VERSION}" ]; then
            echo "Version unchanged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists on the remote; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.decide.outputs.release == 'true'
        with:
          python-version: "3.11"

      - name: Upgrade build tooling
        # The runner ships an older setuptools that pip-audit flags. Upgrade the
        # environment-provided build tooling to a patched version before auditing.
        if: steps.decide.outputs.release == 'true'
        run: python -m pip install --upgrade pip setuptools

      - name: Install dependencies
        if: steps.decide.outputs.release == 'true'
        run: python -m pip install -e ".[dev]"

      - name: Check
        if: steps.decide.outputs.release == 'true'
        run: make check

      - name: Create and push tag
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes

  publish:
    needs: release
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.release.outputs.version }}"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install build

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: "v${{ needs.release.outputs.version }}"
        run: |
          python - <<'PY'
          import os
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"Tag {tag!r} does not match package version {expected!r}")
          PY

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
