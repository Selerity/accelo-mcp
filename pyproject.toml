[project]
name = "accelo-mcp"
version = "0.2.1"
description = "Unofficial MCP server for the Accelo CRM platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Selerity Pty Ltd"}]
dependencies = [
    "mcp~=2.0",
    "httpx~=0.28",
    "pydantic~=2.13",
    "click~=8.4",
    "uvicorn~=0.52",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "respx~=0.23",
    "ruff~=0.16",
    "build~=1.2",
    "pip-audit==2.10.1",
]

[project.scripts]
accelo-mcp = "accelo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accelo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
